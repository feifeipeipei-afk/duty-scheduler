[project]
name = "duty-scheduler"
version = "1.1.0"
description = "值日排班管理系统 — Flask + SQLite + 原生前端"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # 长行在模板渲染 SQL/HTML 字符串中常见，由格式约束统一
    "B008",  # Flask 视图中 request.get_json() 属常规用法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # 测试里允许 assert False 风格

[tool.pytest.ini_options]
testpaths = ["tests"]
